<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MTG VITAL LIFE | RIRE</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .product-page {
      background: #fafafa;
    }

    .product-hero {
      text-align: center;
      padding: 70px 20px 50px;
    }

    .product-hero h1 {
      margin: 0 0 15px;
      font-size: 34px;
      letter-spacing: 0.08em;
    }

    .product-hero p {
      margin: 0;
      color: #777;
      line-height: 1.8;
    }

    .product-cover {
      max-width: 1000px;
      margin: 0 auto 70px;
      padding: 0 20px;
    }

    .product-cover img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .product-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    .product-section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .product-section-title h2 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0.08em;
    }

    .product-section-title p {
      margin: 0;
      color: #777;
    }

    .product-tools {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .product-search {
      width: min(420px, 100%);
      padding: 13px 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }

    .product-filter {
      padding: 13px 40px 13px 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      font-size: 15px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .product-image-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      padding: 25px;
      background: #fff;
      box-sizing: border-box;
    }

    .product-image {
      display: block;
      width: 100%;
      height: 250px;
      object-fit: contain;
    }

    .image-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 250px;
      padding: 20px;
      box-sizing: border-box;
      background: #f7f7f7;
      color: #555;
      text-align: center;
      font-weight: 600;
    }

    .product-info {
      padding: 22px;
      border-top: 1px solid #eee;
    }

    .product-category {
      margin-bottom: 8px;
      color: #999;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .product-name-en {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .product-name-ja {
      margin: 0 0 15px;
      color: #555;
      font-size: 14px;
    }

    .product-price {
      margin-bottom: 18px;
      font-size: 20px;
      font-weight: 700;
    }

    .detail-btn {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #222;
      border-radius: 3px;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s ease;
    }

    .detail-btn:hover {
      opacity: 0.8;
    }

    .product-empty {
      display: none;
      padding: 50px 20px;
      text-align: center;
      color: #777;
    }

    .product-note {
      margin: 45px auto 0;
      max-width: 800px;
      padding: 20px;
      background: #f5f5f5;
      color: #666;
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
    }

    .product-cta {
      margin-top: 60px;
      padding: 50px 20px;
      background: #f2f2f2;
      text-align: center;
    }

    .product-cta h2 {
      margin: 0 0 15px;
      font-size: 25px;
    }

    .product-cta p {
      margin: 0 0 25px;
      color: #666;
      line-height: 1.8;
    }

    .product-cta a {
      display: inline-block;
      padding: 13px 30px;
      background: #222;
      color: #fff;
      text-decoration: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,0.65);
      box-sizing: border-box;
    }

    .modal.is-open {
      display: flex;
    }

    .modal-panel {
      position: relative;
      width: min(760px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 8px;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 15px;
      z-index: 2;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      cursor: pointer;
      font-size: 24px;
      line-height: 38px;
    }

    .modal-content {
      padding: 35px;
    }

    .modal-image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      background: #fafafa;
      margin-bottom: 30px;
    }

    .modal-image {
      width: 100%;
      height: 320px;
      object-fit: contain;
    }

    .modal-content h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .modal-content .modal-ja {
      margin: 0 0 18px;
      color: #666;
    }

    .modal-content .modal-price {
      margin: 0 0 20px;
      font-size: 22px;
      font-weight: 700;
    }

    .modal-content .modal-category {
      margin: 0;
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .product-hero {
        padding: 50px 20px 35px;
      }

      .product-hero h1 {
        font-size: 27px;
      }

      .product-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .product-image-wrap {
        min-height: 300px;
      }

      .product-image {
        height: 270px;
      }

      .modal-content {
        padding: 25px 20px;
      }

      .modal-image-wrap,
      .modal-image {
        height: 280px;
        min-height: 280px;
      }
    }
  </style>
</head>

<body class="product-page">

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">RIRE</a>

      <nav class="nav">
        <a href="index.html">HOME</a>
        <a href="index.html#menu">MENU</a>
        <a href="index.html#contact">CONTACT</a>
      </nav>
    </div>
  </header>

  <main>

    <section class="product-hero">
      <h1>MTG VITAL LIFE</h1>
      <p>
        RIRE取り扱い商品<br>
        ReFa BEAUTY PRODUCTS
      </p>
    </section>

    <section class="product-cover">
      <img
        src="assets/vital-life-catalog.jpg"
        alt="MTG VITAL LIFE FOR ESTHETIC SALON 2026.5"
        onerror="this.style.display='none';"
      >
    </section>

    <section class="product-section">

      <div class="product-section-title">
        <h2>PRODUCTS</h2>
        <p>RIREで取り扱っているReFa商品をご紹介します。</p>
      </div>

      <div class="product-tools">
        <input
          type="search"
          id="productSearch"
          class="product-search"
          placeholder="商品名で検索"
          aria-label="商品名で検索"
        >

        <select
          id="productFilter"
          class="product-filter"
          aria-label="カテゴリーで絞り込み"
        >
          <option value="">すべてのカテゴリー</option>
          <option value="ローラー">ローラー</option>
          <option value="美顔器">美顔器</option>
          <option value="光美容器">光美容器</option>
          <option value="シェーバー">シェーバー</option>
          <option value="ヘッドケア">ヘッドケア</option>
        </select>
      </div>

      <div id="productGrid" class="product-grid"></div>

      <div id="productEmpty" class="product-empty">
        該当する商品がありません。
      </div>

      <div class="product-note">
        ※掲載価格は税込価格です。<br>
        ※商品の在庫状況・販売状況についてはRIREまでお問い合わせください。
      </div>

    </section>

    <section class="product-cta">
      <h2>商品についてのお問い合わせ</h2>
      <p>
        商品の詳細やご購入についてのお問い合わせは<br>
        RIREまでお気軽にご連絡ください。
      </p>

      <a href="index.html#contact">お問い合わせはこちら</a>
    </section>

  </main>

  <footer class="footer">
    <p>&copy; RIRE All Rights Reserved.</p>
  </footer>


  <div id="productModal" class="modal" aria-hidden="true">

    <div class="modal-panel">

      <button
        type="button"
        id="modalClose"
        class="modal-close"
        aria-label="閉じる"
      >
        ×
      </button>

      <div class="modal-content">

        <div class="modal-image-wrap">
          <img
            id="modalImage"
            class="modal-image"
            src=""
            alt=""
          >
        </div>

        <p id="modalCategory" class="modal-category"></p>
        <h2 id="modalName"></h2>
        <p id="modalNameJa" class="modal-ja"></p>
        <p id="modalPrice" class="modal-price"></p>

      </div>

    </div>

  </div>


  <script>
    const PRODUCTS = [
      {
        name: "ReFa CARAT LIFT",
        nameJa: "リファカラットリフト",
        category: "ローラー",
        price: "¥30,800（税込）",
        image: "https://www.refa.net/item/refa_carat_lift/images/img-product.jpg"
      },
      {
        name: "ReFa HYDRA CLEAR",
        nameJa: "リファハイドラクリア",
        category: "美顔器",
        price: "¥27,500（税込）",
        image: "https://www.refa.net/item/refa_hydra_clear/images/img-product.jpg"
      },
      {
        name: "ReFa EPI W COOL",
        nameJa: "リファエピダブル クール",
        category: "光美容器",
        price: "¥121,000（税込）",
        image: "https://www.refa.net/item/refa_epi_w_cool/images/img-product.jpg"
      },
      {
        name: "ReFa EPI W",
        nameJa: "リファエピダブル",
        category: "光美容器",
        price: "¥88,000（税込）",
        image: "https://www.refa.net/item/refa_epi_w/images/img-product.jpg"
      },
      {
        name: "ReFa MULTI SHAVER",
        nameJa: "リファマルチシェーバー",
        category: "シェーバー",
        price: "¥7,700（税込）",
        image: "https://www.refa.net/item/refa_multi_shaver/images/img-product.jpg"
      },
      {
        name: "ReFa SKIM SHAVER",
        nameJa: "リファスキムシェーバー",
        category: "シェーバー",
        price: "¥5,280（税込）",
        image: "https://www.refa.net/item/refa_skim_shaver/images/img-hero-sp.jpg"
      },
      {
        name: "ReFa BEAUTECH HEAD SPA",
        nameJa: "リファビューテック ヘッドスパ",
        category: "ヘッドケア",
        price: "¥33,000（税込）",
        image: "https://www.refa.net/item/refa_beautech_head_spa/images/img-hero-sp.jpg"
      }
    ];


    const grid = document.getElementById("productGrid");
    const empty = document.getElementById("productEmpty");
    const search = document.getElementById("productSearch");
    const filter = document.getElementById("productFilter");

    const modal = document.getElementById("productModal");
    const modalClose = document.getElementById("modalClose");
    const modalImage = document.getElementById("modalImage");
    const modalCategory = document.getElementById("modalCategory");
    const modalName = document.getElementById("modalName");
    const modalNameJa = document.getElementById("modalNameJa");
    const modalPrice = document.getElementById("modalPrice");


    function createImage(product, isModal) {
      const img = document.createElement("img");

      img.className = isModal ? "modal-image" : "product-image";
      img.src = product.image;
      img.alt = product.name;
      img.loading = isModal ? "eager" : "lazy";

      img.addEventListener("error", function () {
        const parent = img.parentElement;

        if (!parent) {
          return;
        }

        img.style.display = "none";

        if (!parent.querySelector(".image-fallback")) {
          const fallback = document.createElement("div");
          fallback.className = "image-fallback";
          fallback.textContent = product.name;
          parent.appendChild(fallback);
        }
      });

      return img;
    }


    function openModal(product) {
      modalImage.style.display = "block";

      const oldFallback = modalImage.parentElement.querySelector(".image-fallback");

      if (oldFallback) {
        oldFallback.remove();
      }

      modalImage.src = product.image;
      modalImage.alt = product.name;

      modalCategory.textContent = product.category;
      modalName.textContent = product.name;
      modalNameJa.textContent = product.nameJa;
      modalPrice.textContent = product.price;

      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }


    function closeModal() {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }


    function renderProducts() {
      const keyword = search.value.trim().toLowerCase();
      const category = filter.value;

      grid.innerHTML = "";

      let count = 0;

      PRODUCTS.forEach(function (product) {

        const searchableText = (
          product.name +
          " " +
          product.nameJa +
          " " +
          product.category
        ).toLowerCase();

        if (keyword && searchableText.indexOf(keyword) === -1) {
          return;
        }

        if (category && product.category !== category) {
          return;
        }

        count++;

        const card = document.createElement("article");
        card.className = "product-card";


        const imageWrap = document.createElement("div");
        imageWrap.className = "product-image-wrap";

        const productImage = createImage(product, false);

        imageWrap.appendChild(productImage);


        const info = document.createElement("div");
        info.className = "product-info";


        const categoryText = document.createElement("div");
        categoryText.className = "product-category";
        categoryText.textContent = product.category;


        const nameEn = document.createElement("h3");
        nameEn.className = "product-name-en";
        nameEn.textContent = product.name;


        const nameJa = document.createElement("p");
        nameJa.className = "product-name-ja";
        nameJa.textContent = product.nameJa;


        const price = document.createElement("div");
        price.className = "product-price";
        price.textContent = product.price;


        const button = document.createElement("button");
        button.type = "button";
        button.className = "detail-btn";
        button.textContent = "詳細を見る";

        button.addEventListener("click", function () {
          openModal(product);
        });


        info.appendChild(categoryText);
        info.appendChild(nameEn);
        info.appendChild(nameJa);
        info.appendChild(price);
        info.appendChild(button);

        card.appendChild(imageWrap);
        card.appendChild(info);

        grid.appendChild(card);
      });


      empty.style.display = count === 0 ? "block" : "none";
    }


    search.addEventListener("input", renderProducts);
    filter.addEventListener("change", renderProducts);


    modalClose.addEventListener("click", closeModal);


    modal.addEventListener("click", function (event) {
      if (event.target === modal) {
        closeModal();
      }
    });


    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeModal();
      }
    });


    modalImage.addEventListener("error", function () {
      modalImage.style.display = "none";

      const parent = modalImage.parentElement;

      if (!parent.querySelector(".image-fallback")) {
        const fallback = document.createElement("div");
        fallback.className = "image-fallback";
        fallback.textContent = modalName.textContent;
        parent.appendChild(fallback);
      }
    });


    renderProducts();
  </script>

</body>
</html>
